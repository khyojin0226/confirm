<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>팀장님께 컨펌 요청</title>
  <style>
    :root {
      --ink: #1f2937;
      --muted: #667085;
      --line: #e7e8ec;
      --paper: #ffffff;
      --bg: #f5f7fb;
      --primary: #3268f5;
      --primary-dark: #2455d5;
      --success: #1b9a68;
      --shadow: 0 18px 50px rgba(36, 55, 90, .11);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, rgba(50, 104, 245, .12), transparent 28rem),
        radial-gradient(circle at 100% 100%, rgba(255, 214, 113, .18), transparent 26rem),
        var(--bg);
      font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", system-ui, -apple-system, sans-serif;
    }

    button, input, textarea { font: inherit; }
    button { cursor: pointer; }

    .app-shell { width: min(940px, calc(100% - 32px)); margin: 0 auto; padding: 40px 0 56px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 24px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo {
      width: 42px; height: 42px; display: grid; place-items: center; border-radius: 14px;
      color: #fff; background: linear-gradient(135deg, #376cf6, #6f82f9); font-weight: 800;
      box-shadow: 0 8px 18px rgba(50, 104, 245, .25);
    }
    .eyebrow { margin: 0 0 3px; color: var(--primary); font-size: 12px; font-weight: 800; letter-spacing: .11em; }
    .brand h1 { margin: 0; font-size: 17px; letter-spacing: -.03em; }
    .edit-toggle {
      display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 12px;
      padding: 10px 14px; color: #344054; background: rgba(255,255,255,.8); font-size: 13px; font-weight: 700;
    }
    .edit-toggle:hover { border-color: #b9c6e8; background: #fff; }

    .card { overflow: hidden; border: 1px solid rgba(231, 232, 236, .95); border-radius: 24px; background: var(--paper); box-shadow: var(--shadow); }
    .hero { padding: 42px 48px 30px; border-bottom: 1px solid var(--line); }
    .status { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 16px; color: #16794f; font-size: 13px; font-weight: 800; }
    .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #2fc27e; box-shadow: 0 0 0 5px #e6f8ef; }
    .hero h2 { margin: 0; max-width: 660px; font-size: clamp(28px, 5vw, 44px); line-height: 1.15; letter-spacing: -.06em; }
    .hero p { margin: 16px 0 0; color: var(--muted); font-size: 15px; line-height: 1.8; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 8px 11px; border-radius: 999px; color: #536076; background: #f5f7fb; font-size: 12px; font-weight: 700; }

    .content { padding: 34px 48px 42px; }
    .section-label { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
    .section-label h3 { margin: 0; font-size: 15px; letter-spacing: -.02em; }
    .section-label span { color: #98a2b3; font-size: 12px; }
    .request-box { min-height: 160px; padding: 20px; border: 1px solid var(--line); border-radius: 16px; color: #344054; background: #fbfcfe; font-size: 15px; line-height: 1.8; white-space: pre-wrap; }
    .request-box.empty { color: #98a2b3; }
    .inline-link { color: var(--primary); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
    .inline-link:hover { color: var(--primary-dark); }
    .attachments { display: grid; gap: 10px; margin-top: 18px; }
    .image-preview { overflow: hidden; border: 1px solid var(--line); border-radius: 16px; background: #f7f9fc; }
    .image-preview img { display: block; width: 100%; max-height: 620px; object-fit: contain; background: #f7f9fc; }
    .attachment { display: flex; align-items: center; gap: 12px; padding: 13px 15px; border: 1px solid var(--line); border-radius: 13px; background: #fff; }
    .file-icon { width: 34px; height: 34px; display: grid; place-items: center; flex: none; border-radius: 10px; color: #3268f5; background: #edf2ff; font-size: 16px; }
    .file-copy { min-width: 0; flex: 1; }
    .file-copy strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
    .file-copy small { color: #98a2b3; font-size: 11px; }
    .file-open { border: 0; padding: 7px 9px; border-radius: 8px; color: var(--primary); background: #f1f4ff; font-size: 11px; font-weight: 800; }
    .file-open:hover { background: #e6ecff; }

    .actions { position: relative; display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 128px; margin-top: 38px; isolation: isolate; }
    .action-btn { min-width: 150px; border: 0; border-radius: 13px; padding: 15px 22px; font-weight: 800; transition: transform .18s ease, box-shadow .18s ease, background .18s ease; }
    .approve { position: relative; z-index: 5; color: #fff; background: linear-gradient(135deg, var(--primary), #5b78f6); box-shadow: 0 10px 20px rgba(50,104,245,.22); transform: scale(var(--approve-scale, 1)); transform-origin: center; }
    .approve:hover { transform: scale(var(--approve-scale, 1)) translateY(-2px); background: linear-gradient(135deg, var(--primary-dark), #506ef0); box-shadow: 0 14px 24px rgba(50,104,245,.27); }
    .approve.takeover { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; width: 100vw; height: 100vh; min-width: 0; margin: 0; border-radius: 0; padding: 0; font-size: clamp(42px, 10vw, 112px); transform: none; box-shadow: 0 0 0 100vmax rgba(50, 104, 245, .96); }
    .approve.takeover:hover { transform: none; }
    .reject { position: relative; z-index: 1; color: #667085; border: 1px solid #e4e7ec; background: #fff; transition: left .3s cubic-bezier(.2,.9,.25,1.35), top .3s cubic-bezier(.2,.9,.25,1.35), transform .3s cubic-bezier(.2,.9,.25,1.35), opacity .18s ease; }
    .reject:hover { color: #98a2b3; }
    .reject.is-running { box-shadow: 0 8px 18px rgba(50, 104, 245, .12); }
    .hint { margin: 14px 0 0; text-align: center; color: #a0a8b8; font-size: 11px; }
    .footer-note { margin: 26px 0 0; text-align: center; color: #98a2b3; font-size: 11px; }

    .editor-panel { display: none; padding: 26px 48px 32px; border-bottom: 1px solid var(--line); background: #fafbff; }
    .card.editing .editor-panel { display: block; }
    .editor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .field { display: grid; gap: 7px; }
    .field.full { grid-column: 1 / -1; }
    .field label { color: #667085; font-size: 12px; font-weight: 800; }
    .field input, .field textarea { width: 100%; border: 1px solid #dfe3eb; border-radius: 11px; outline: none; padding: 11px 12px; color: #344054; background: #fff; }
    .field input:focus, .field textarea:focus { border-color: #8da8fb; box-shadow: 0 0 0 3px #edf2ff; }
    .field textarea { min-height: 120px; resize: vertical; line-height: 1.6; }
    .editor-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; margin-top: 15px; }
    .secondary-btn, .save-btn { border: 0; border-radius: 10px; padding: 10px 13px; font-size: 12px; font-weight: 800; }
    .save-btn { color: #fff; background: var(--primary); }
    .secondary-btn { color: #526078; background: #eef1f7; }
    .secondary-btn:hover { background: #e5e9f1; }
    .editor-help { margin: 11px 0 0; color: #98a2b3; font-size: 11px; line-height: 1.6; }
    .toast { position: fixed; left: 50%; bottom: 24px; z-index: 20; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; padding: 11px 15px; border-radius: 10px; color: #fff; background: #253858; box-shadow: 0 10px 24px rgba(23, 37, 61, .2); font-size: 12px; transition: .25s ease; }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }

    .success-page { display: none; text-align: center; padding: 82px 32px 90px; }
    .success-page.active { display: block; }
    .success-icon { width: 76px; height: 76px; display: grid; place-items: center; margin: 0 auto 22px; border-radius: 24px; color: #fff; background: linear-gradient(135deg, #22af76, #71d6a6); font-size: 34px; box-shadow: 0 14px 28px rgba(34, 175, 118, .24); }
    .success-page h2 { margin: 0; font-size: clamp(30px, 6vw, 50px); letter-spacing: -.08em; }
    .success-page p { margin: 13px 0 28px; color: var(--muted); font-size: 14px; }
    .back-btn { border: 1px solid var(--line); border-radius: 11px; padding: 11px 16px; color: #526078; background: #fff; font-size: 12px; font-weight: 800; }
    .back-btn:hover { background: #f7f8fb; }
    body.confirmation-takeover { overflow: hidden; }
    body.confirmation-takeover .card { overflow: visible; }

    @media (max-width: 640px) {
      .app-shell { width: min(100% - 20px, 940px); padding-top: 20px; }
      .topbar { align-items: flex-start; }
      .hero, .content, .editor-panel { padding-left: 22px; padding-right: 22px; }
      .hero { padding-top: 30px; }
      .editor-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .actions { min-height: 112px; align-items: flex-start; }
      .action-btn { min-width: 0; flex: 1; }
      .hint { max-width: 230px; margin: 8px auto 0; line-height: 1.5; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <div class="topbar">
      <div class="brand">
        <div class="logo">✓</div>
        <div>
          <p class="eyebrow">CONFIRMATION REQUEST</p>
          <h1>팀장님께 컨펌 요청</h1>
        </div>
      </div>
      <button class="edit-toggle" id="editToggle" type="button">✎ 내용 수정</button>
    </div>

    <section class="card" id="card">
      <div class="editor-panel" aria-label="컨펌 요청 내용 수정">
        <div class="editor-grid">
          <div class="field full">
            <label for="titleInput">제목</label>
            <input id="titleInput" type="text" maxlength="80" />
          </div>
          <div class="field full">
            <label for="messageInput">요청 내용</label>
            <textarea id="messageInput" maxlength="3000"></textarea>
          </div>
          <div class="field">
            <label for="requesterInput">요청자</label>
            <input id="requesterInput" type="text" maxlength="40" />
          </div>
          <div class="field">
            <label for="deadlineInput">희망 확인일</label>
            <input id="deadlineInput" type="text" maxlength="40" />
          </div>
          <div class="field full">
            <label for="linkInput">바로가기 링크 (선택)</label>
            <input id="linkInput" type="url" placeholder="https://example.com" maxlength="2000" />
          </div>
        </div>
        <div class="editor-actions">
          <button class="save-btn" id="saveBtn" type="button">저장하기</button>
          <button class="secondary-btn" id="fileBtn" type="button">파일 첨부</button>
          <button class="secondary-btn" id="clearFileBtn" type="button">첨부 파일 지우기</button>
          <input id="fileInput" type="file" hidden />
        </div>
        <p class="editor-help">수정한 내용은 이 브라우저에 자동 저장됩니다. 파일은 5MB 이하 1개까지 첨부할 수 있어요.</p>
      </div>

      <div id="requestPage">
        <header class="hero">
          <div class="status">확인 요청 중</div>
          <h2 id="titleView"></h2>
          <div class="meta">
            <span class="pill">👤 요청자 <b id="requesterView"></b></span>
            <span class="pill">📅 희망 확인일 <b id="deadlineView"></b></span>
          </div>
        </header>

        <div class="content">
          <div class="request-box" id="messageView"></div>
          <div class="attachments" id="attachmentsView"></div>

          <div class="actions" id="actions">
            <button class="action-btn approve" id="approveBtn" type="button">완벽합니다!</button>
            <button class="action-btn reject" id="rejectBtn" type="button">반려합니다!</button>
          </div>
          <p class="hint">반려 버튼은 조금 부끄러움이 많습니다.</p>
          <p class="footer-note">버튼을 눌러 팀장님의 컨펌을 남겨주세요.</p>
        </div>
      </div>

      <div class="success-page" id="successPage">
        <div class="success-icon">✓</div>
        <h2>저도 압니다</h2>
        <p>완벽한 컨펌이 기록되었습니다.</p>
        <button class="back-btn" id="backBtn" type="button">요청 페이지로 돌아가기</button>
      </div>
    </section>
  </main>
  <div class="toast" id="toast" role="status"></div>

  <script>
    const STORAGE_KEY = "teamLeadConfirmRequest";
    const DEFAULT_DATA = {
      title: "신규 캠페인 시안 컨펌 부탁드립니다",
      message: "안녕하세요, 팀장님.\n\n이번 주 신규 캠페인 시안을 정리했습니다.\n전체적인 방향과 문구를 확인해 주시면 다음 단계로 진행하겠습니다.",
      requester: "홍길동",
      deadline: "2026년 8월 29일",
      link: "",
      file: null
    };

    const $ = (selector) => document.querySelector(selector);
    let data = loadData();
    let toastTimer;

    function loadData() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return saved ? { ...DEFAULT_DATA, ...saved } : { ...DEFAULT_DATA };
      } catch (_) {
        return { ...DEFAULT_DATA };
      }
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
      }[char]));
    }

    function formatBytes(bytes) {
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
    }

    function normalizeLink(value) {
      try {
        const url = new URL(String(value || "").trim());
        return /^https?:$/.test(url.protocol) ? url.href : "";
      } catch (_) {
        return "";
      }
    }

    function linkifyMessage(value) {
      const source = String(value || "");
      const urlPattern = /https?:\/\/[^\s]+/gi;
      let html = "";
      let lastIndex = 0;
      let match;

      while ((match = urlPattern.exec(source))) {
        html += escapeHtml(source.slice(lastIndex, match.index));
        let urlText = match[0];
        let trailing = "";
        while (/[.,!?;:)\]}]$/.test(urlText)) {
          trailing = urlText.slice(-1) + trailing;
          urlText = urlText.slice(0, -1);
        }
        const safeUrl = normalizeLink(urlText);
        html += safeUrl
          ? `<a class="inline-link" href="${escapeHtml(safeUrl)}" target="_blank" rel="noopener noreferrer">${escapeHtml(urlText)}</a>${escapeHtml(trailing)}`
          : escapeHtml(match[0]);
        lastIndex = match.index + match[0].length;
      }

      return html + escapeHtml(source.slice(lastIndex));
    }

    function render() {
      $("#titleView").textContent = data.title || "컨펌 요청드립니다";
      $("#messageView").innerHTML = data.message ? linkifyMessage(data.message) : "요청 내용을 입력해 주세요.";
      $("#messageView").classList.toggle("empty", !data.message);
      $("#requesterView").textContent = data.requester || "미입력";
      $("#deadlineView").textContent = data.deadline || "미정";

      $("#titleInput").value = data.title || "";
      $("#messageInput").value = data.message || "";
      $("#requesterInput").value = data.requester || "";
      $("#deadlineInput").value = data.deadline || "";
      $("#linkInput").value = data.link || "";

      const attachment = data.file;
      const link = normalizeLink(data.link);
      const linkMarkup = link ? `
        <div class="attachment">
          <div class="file-icon">🔗</div>
          <div class="file-copy">
            <strong>관련 링크</strong>
            <small>${escapeHtml(link)}</small>
          </div>
          <a class="file-open" href="${escapeHtml(link)}" target="_blank" rel="noopener noreferrer">바로가기</a>
        </div>` : "";
      $("#attachmentsView").innerHTML = attachment ? `
        ${attachment.type && attachment.type.startsWith("image/") ? `
          <div class="image-preview">
            <img src="${escapeHtml(attachment.dataUrl)}" alt="${escapeHtml(attachment.name)}" />
          </div>` : ""}
        <div class="attachment">
          <div class="file-icon">↗</div>
          <div class="file-copy">
            <strong>${escapeHtml(attachment.name)}</strong>
            <small>${escapeHtml(attachment.type || "파일")} · ${formatBytes(attachment.size)}</small>
          </div>
          <button class="file-open" type="button" id="openFileBtn">열기</button>
        </div>` : "";

      $("#attachmentsView").insertAdjacentHTML("beforeend", linkMarkup);

      $("#openFileBtn")?.addEventListener("click", openAttachment);
    }

    function showToast(message) {
      const toast = $("#toast");
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
    }

    function setEditing(isEditing) {
      $("#card").classList.toggle("editing", isEditing);
      $("#editToggle").textContent = isEditing ? "× 수정 닫기" : "✎ 내용 수정";
    }

    function moveRejectButton() {
      const button = $("#rejectBtn");
      const actions = $("#actions");
      const maxX = Math.max(0, actions.clientWidth - button.offsetWidth);
      const maxY = Math.max(0, actions.clientHeight - button.offsetHeight);
      const previousX = parseFloat(button.dataset.x || String(maxX / 2));
      const previousY = parseFloat(button.dataset.y || String(maxY / 2));
      let x = previousX;
      let y = previousY;
      for (let attempt = 0; attempt < 12; attempt += 1) {
        x = Math.floor(Math.random() * (maxX + 1));
        y = Math.floor(Math.random() * (maxY + 1));
        if (Math.hypot(x - previousX, y - previousY) > 55 || maxX < 56) break;
      }
      const tilt = Math.round((Math.random() * 30 - 15) * 10) / 10;
      button.style.position = "absolute";
      button.style.left = `${x}px`;
      button.style.top = `${y}px`;
      button.style.transform = `rotate(${tilt}deg) scale(${(Math.random() * .18 + .9).toFixed(2)})`;
      button.style.opacity = "0.16";
      button.dataset.x = x;
      button.dataset.y = y;
      button.classList.add("is-running");
      growApproveButton();
      window.setTimeout(() => {
        if (!$("#approveBtn").classList.contains("takeover")) button.style.opacity = "1";
      }, 180);
      showToast("앗, 반려 버튼이 도망갔어요!");
    }

    let escapeCount = 0;
    function growApproveButton() {
      escapeCount += 1;
      const approve = $("#approveBtn");
      const progress = Math.min(escapeCount, 100) / 100;
      const scale = 1 + Math.pow(progress, 1.6) * 5;
      approve.style.setProperty("--approve-scale", scale.toFixed(2));
      if (escapeCount >= 100) {
        approve.classList.add("takeover");
        document.body.classList.add("confirmation-takeover");
      }
    }

    function openAttachment() {
      if (!data.file?.dataUrl) return showToast("저장된 파일을 열 수 없습니다.");
      const link = document.createElement("a");
      link.href = data.file.dataUrl;
      link.target = "_blank";
      link.rel = "noopener";
      link.click();
    }

    $("#editToggle").addEventListener("click", () => {
      setEditing(!$("#card").classList.contains("editing"));
    });

    $("#saveBtn").addEventListener("click", () => {
      data.title = $("#titleInput").value.trim();
      data.message = $("#messageInput").value.trim();
      data.requester = $("#requesterInput").value.trim();
      data.deadline = $("#deadlineInput").value.trim();
      const rawLink = $("#linkInput").value.trim();
      if (rawLink && !normalizeLink(rawLink)) {
        return showToast("링크는 http:// 또는 https://로 시작해야 해요.");
      }
      data.link = normalizeLink(rawLink);
      saveData();
      render();
      setEditing(false);
      showToast("컨펌 요청 내용이 저장되었습니다.");
    });

    $("#fileBtn").addEventListener("click", () => $("#fileInput").click());
    $("#fileInput").addEventListener("change", (event) => {
      const file = event.target.files[0];
      if (!file) return;
      if (file.size > 5 * 1024 * 1024) {
        event.target.value = "";
        return showToast("파일은 5MB 이하만 첨부할 수 있어요.");
      }
      const reader = new FileReader();
      reader.onload = () => {
        data.file = { name: file.name, type: file.type, size: file.size, dataUrl: reader.result };
        saveData();
        render();
        showToast("파일이 첨부되었습니다.");
      };
      reader.readAsDataURL(file);
    });

    $("#clearFileBtn").addEventListener("click", () => {
      data.file = null;
      saveData();
      $("#fileInput").value = "";
      render();
      showToast("첨부 파일을 지웠습니다.");
    });

    let lastEscapeAt = 0;
    function escapeOnApproach() {
      const now = Date.now();
      if (now - lastEscapeAt < 240) return;
      lastEscapeAt = now;
      moveRejectButton();
    }

    $("#rejectBtn").addEventListener("mouseenter", escapeOnApproach);
    $("#rejectBtn").addEventListener("pointermove", escapeOnApproach);
    $("#rejectBtn").addEventListener("focus", escapeOnApproach);
    $("#rejectBtn").addEventListener("click", (event) => {
      event.preventDefault();
      moveRejectButton();
    });

    $("#approveBtn").addEventListener("click", () => {
      $("#requestPage").style.display = "none";
      $("#successPage").classList.add("active");
      $("#editToggle").style.visibility = "hidden";
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    $("#backBtn").addEventListener("click", () => {
      $("#successPage").classList.remove("active");
      $("#requestPage").style.display = "block";
      $("#editToggle").style.visibility = "visible";
      const reject = $("#rejectBtn");
      reject.style.position = "relative";
      reject.style.left = "";
      reject.style.top = "";
      reject.style.transform = "";
      reject.style.opacity = "";
      reject.dataset.x = "0";
      reject.dataset.y = "0";
      reject.classList.remove("is-running");
      escapeCount = 0;
      const approve = $("#approveBtn");
      approve.style.setProperty("--approve-scale", "1");
      approve.classList.remove("takeover");
      document.body.classList.remove("confirmation-takeover");
    });

    render();
  </script>
</body>
</html>
